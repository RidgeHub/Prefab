<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ridgeline Electrical — Label Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>

:root{--bg:#f0f4f8;--surface:#ffffff;--surface2:#eef2f7;--surface3:#dde6f0;--border:rgba(30,80,160,0.08);--border2:rgba(30,80,160,0.15);--accent:#1a5fb4;--accent2:#3584e4;--accent3:#4a90d9;--text:#1a2540;--text2:#4a6080;--text3:#8aaac8;--green:#1a7a4e;--green-bg:rgba(26,122,78,0.08);--yellow:#8a6200;--yellow-bg:rgba(240,192,64,0.1);--blue:#1a5fb4;--blue-bg:rgba(26,95,180,0.08);--red:#c03020;--red-bg:rgba(192,48,32,0.08);--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--radius:12px;--shadow:0 2px 8px rgba(30,80,160,0.08);--shadow-lg:0 8px 32px rgba(30,80,160,0.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(52,132,228,0.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.site-header{padding:.875rem 1.5rem;background:linear-gradient(135deg,#1a5fb4,#3584e4);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(20,60,140,0.25);flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;text-decoration:none;flex-shrink:0;transition:background 0.15s}
.logo-mark:hover{background:rgba(255,255,255,0.3)}
.header-title{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:rgba(255,255,255,0.7);font-family:var(--mono)}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--border2);border-radius:8px;padding:8px 16px;font-size:14px;color:var(--text2);cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:#1550a0;border-color:#1550a0;color:#fff}
.btn-hdr{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:7px;padding:7px 14px;font-size:13px;color:#fff;cursor:pointer;font-family:var(--sans);transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn-hdr:hover{background:rgba(255,255,255,0.25)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn-sm{padding:5px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.card-header{padding:10px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#fff;font-family:var(--mono)}
.card-body{padding:14px 16px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label,.form-group label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);font-family:var(--mono);display:block;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=file],select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;font-size:15px;font-family:var(--sans);color:var(--text);outline:none;width:100%;transition:border-color 0.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
input::placeholder,textarea::placeholder{color:var(--text3)}
input[type=file]{color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,50,0.6);z-index:200;display:none;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:14px;border:1px solid var(--border2);border-top:3px solid var(--accent);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:1.25rem;color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions .btn{flex:1;justify-content:center;padding:11px;font-size:14px}
.info-box{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.sync-status{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:4px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.4);flex-shrink:0}
.sync-dot.synced{background:#2ecc8a}.sync-dot.syncing{background:#f0c040;animation:blink 1s infinite}.sync-dot.error{background:#e05555}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.progress-bar-outer{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s}
.progress-bar-fill.done{background:var(--green)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-family:var(--mono);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:10px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.content{position:relative;z-index:1;padding:1.5rem;max-width:960px;margin:0 auto;padding-bottom:4rem}

.project-selector{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);margin-bottom:14px}
.info-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info-chip{font-size:12px;font-family:var(--mono);color:var(--text2);padding:4px 10px;background:var(--surface2);border-radius:99px;border:1px solid var(--border2)}
.label-sheet{display:flex;flex-direction:column;gap:14px}
.label-page{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.label-cell{background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;font-family:'DM Sans',sans-serif;color:#000;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.label-cell.empty{border:1px dashed #dde6f0;background:#f8faff;min-height:110px}
.label-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.label-id{font-size:22px;font-weight:700;line-height:1;color:#1a2540}
.label-room{font-size:11px;color:#666;margin-top:3px}
.label-height{font-size:14px;font-weight:600;color:#1a2540;text-align:right;white-space:nowrap;padding-top:2px}
.label-middle{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.label-desc{font-size:13px;font-weight:600;color:#1a2540;line-height:1.4}
.label-grade{font-size:11px;color:#888;margin-top:2px;font-style:italic}
.label-bottom{font-size:11px;color:#999;border-top:1px solid #eee;padding-top:5px;text-transform:uppercase;letter-spacing:0.04em}
.page-divider{font-size:12px;color:var(--text3);font-family:var(--mono);text-align:center;padding:4px 0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff!important}body::before{display:none!important}
  .site-header,.content>*:not(#labelSheet){display:none!important}
  .label-sheet{padding:0.19in 0.15in 0 0.15in;width:8.5in}
  .label-page{display:grid;grid-template-columns:4in 4in;grid-template-rows:repeat(5,2in);column-gap:0.19in;row-gap:0;page-break-after:always}
  .label-page:last-child{page-break-after:avoid}
  .label-cell{width:4in;height:2in;padding:0.16in 0.2in 0.14in 0.2in;border:1px solid #ccc;border-radius:6px;background:#fff}
  .label-id{font-size:26pt}.label-room{font-size:9.5pt}.label-height{font-size:14pt}.label-desc{font-size:12.5pt}.label-grade{font-size:9pt}.label-bottom{font-size:8.5pt}
}
</style>
</head>
<body>
<div class="site-header">
  <div class="header-left">
    <a href="index.html" class="logo-mark">REI</a>
    <div><div class="header-title">Label Generator</div><div class="header-sub">Ridgeline Electrical — Prefab</div></div>
  </div>
  <div class="header-right">
    <a href="index.html" class="btn-hdr">← Hub</a>
    <button class="btn-hdr no-print" onclick="window.print()" id="printBtn" style="display:none;">🖨 Print Labels</button>
  </div>
</div>
<div class="content">
  <div class="project-selector">
    <div class="form-label">Select Project</div>
    <select id="projectSelect" onchange="renderLabels()"><option value="">Loading projects…</option></select>
    <div class="info-row" id="infoRow" style="display:none;">
      <span class="info-chip" id="infoCount"></span>
      <span class="info-chip" id="infoPages"></span>
      <span class="info-chip" id="infoHeight"></span>
    </div>
  </div>
  <div id="labelSheet"><div class="empty"><div class="empty-icon">🏷️</div>Select a project to generate labels.</div></div>
</div>
<script>
const RAW='https://raw.githubusercontent.com/RidgeHub/Prefab/main/prefab-projects.json';
const LABELS_PER_PAGE=10;
const gradeRe=/hospital\s+grade|commercial\s+grade|specification\s+grade|residential\s+grade/gi;
let projects=[];
async function loadProjects(){
  try{
    const apiRes=await fetch('https://api.github.com/repos/RidgeHub/Prefab/contents/prefab-projects.json',{headers:{Accept:'application/vnd.github.v3+json'}});
    if(!apiRes.ok)throw new Error();
    const d=await apiRes.json();
    projects=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
    const sel=document.getElementById('projectSelect');
    sel.innerHTML='<option value="">— Select a project —</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.num?' (#'+esc(p.num)+')':'')+'</option>').join('');
  }catch(e){document.getElementById('labelSheet').innerHTML='<div class="empty">Could not load projects.</div>';}
}
function stripQty(s){return s.replace(/\s*\(\d+\)\s*/g,'').trim();}
function stripAdj(s){return s.replace(/[\/,]?\s*Adj(ustable)?/gi,'').replace(/Adj(ustable)?\s*[\/,]?\s*/gi,'').trim();}
function getGang(s){const m=s.match(/\b([1-4])\s*[Gg](ang)?\b/);return m?m[1]+'G':'';}
function formatAssemblyDesc(a){
  const gang=a.plaster?getGang(stripAdj(a.plaster)):'';
  let grade='';
  const devParts=(a.devices||[]).map(d=>{
    const parts=stripQty(d).split('/').map(p=>p.trim()).filter(p=>p);
    const filtered=parts.filter(p=>{gradeRe.lastIndex=0;if(gradeRe.test(p)){grade=p;return false;}return true;});
    gradeRe.lastIndex=0;
    return filtered.join(' - ');
  }).filter(p=>p);
  const pieces=[];
  if(gang)pieces.push(gang);
  if(devParts.length)pieces.push(devParts.join(' + '));
  return{desc:pieces.join(' / '),grade};
}
function renderLabels(){
  const id=document.getElementById('projectSelect').value;
  const sheet=document.getElementById('labelSheet');
  const infoRow=document.getElementById('infoRow');
  if(!id){sheet.innerHTML='<div class="empty"><div class="empty-icon">🏷️</div>Select a project above.</div>';infoRow.style.display='none';document.getElementById('printBtn').style.display='none';return;}
  const project=projects.find(p=>p.id===id);
  if(!project)return;
  const assemblies=project.assemblies||[];
  const hasHeight=assemblies.some(a=>a.height);
  const totalPages=Math.ceil(assemblies.length/LABELS_PER_PAGE);
  infoRow.style.display='flex';
  document.getElementById('infoCount').textContent=assemblies.length+' labels';
  document.getElementById('infoPages').textContent=totalPages+' page'+(totalPages!==1?'s':'');
  document.getElementById('infoHeight').textContent=hasHeight?'✓ Heights found':'⚠ No height column';
  document.getElementById('printBtn').style.display='';
  let html='<div class="label-sheet">';
  for(let page=0;page<totalPages;page++){
    const pageA=[...assemblies.slice(page*LABELS_PER_PAGE,(page+1)*LABELS_PER_PAGE)];
    while(pageA.length<LABELS_PER_PAGE)pageA.push(null);
    if(page>0)html+='<div class="page-divider no-print">— Page '+(page+1)+' —</div>';
    html+='<div class="label-page">';
    pageA.forEach(a=>{
      if(!a){html+='<div class="label-cell empty"></div>';return;}
      const{desc,grade}=formatAssemblyDesc(a);
      html+='<div class="label-cell"><div class="label-top"><div><div class="label-id">'+esc(a.labelId)+'</div><div class="label-room">Room '+esc(a.room)+'</div></div>'+(a.height?'<div class="label-height">'+esc(a.height)+'</div>':'')+'</div><div class="label-middle"><div class="label-desc">'+esc(desc||a.code)+'</div>'+(grade?'<div class="label-grade">'+esc(grade)+'</div>':'')+'</div><div class="label-bottom">'+esc(project.name)+'</div></div>';
    });
    html+='</div>';
  }
  html+='</div>';
  sheet.innerHTML=html;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadProjects();
</script>
</body>
</html>
