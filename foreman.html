<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RidgeHub — Foreman Receiving</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#f0ede8;--surface:#faf8f5;--surface2:#e8e4de;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1a1714;--text2:#6b6560;--text3:#a8a29c;
  --accent:#c84b2f;--green:#2a7a4b;--green-bg:rgba(42,122,75,0.1);
  --yellow:#8a6a1a;--yellow-bg:rgba(240,192,64,0.12);
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,0.04) 1px,transparent 1px);background-size:24px 24px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 0 4rem}

header{padding:1rem 1.25rem;background:var(--surface);border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo-mark{width:32px;height:32px;border-radius:6px;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;flex-shrink:0}
.header-text{}
.header-title{font-size:15px;font-weight:700}
.header-sub{font-size:11px;color:var(--text2);font-family:var(--mono)}

.content{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px}

/* Project cards */
.project-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden}
.project-card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.project-name{font-size:16px;font-weight:700;margin-bottom:2px}
.project-meta{font-size:11px;color:var(--text2);font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap}
.status-pill{font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.pill-shipped{background:rgba(232,129,58,0.15);color:#c06010;border:1px solid rgba(232,129,58,0.3)}
.pill-received{background:var(--green-bg);color:var(--green);border:1px solid rgba(42,122,75,0.3)}
.pill-inprogress{background:rgba(91,156,246,0.12);color:#1a5fba;border:1px solid rgba(91,156,246,0.3)}
.pill-ready{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(240,192,64,0.3)}

.project-details{padding:10px 1.25rem;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.detail-item{display:flex;flex-direction:column;gap:2px}
.detail-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);font-family:var(--mono)}
.detail-value{font-size:13px;font-weight:500;color:var(--text)}

.project-action{padding:1rem 1.25rem}
.btn-received{width:100%;padding:14px;font-size:16px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-received:hover{background:#1e5c38}
.btn-received:active{background:#164830}
.received-info{background:var(--green-bg);border:1px solid rgba(42,122,75,0.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--green);font-family:var(--mono);line-height:1.6}

/* Name prompt */
.name-bar{background:var(--yellow-bg);border-bottom:1px solid rgba(240,192,64,0.3);padding:10px 1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name-bar-label{font-size:13px;color:var(--yellow);font-weight:500;white-space:nowrap}
.name-input-wrap{display:flex;gap:6px;flex:1}
.name-input-wrap input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;min-width:0}
.name-input-wrap input:focus{border-color:var(--green)}
.btn-set-name{background:var(--green);border:none;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;font-family:var(--sans)}

.empty-state{text-align:center;padding:3rem 1.25rem;color:var(--text3);font-family:var(--mono);font-size:13px}
.empty-icon{font-size:40px;margin-bottom:12px}
.loading{text-align:center;padding:2rem;color:var(--text3);font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo-mark">✅</div>
    <div class="header-text">
      <div class="header-title">Foreman Receiving</div>
      <div class="header-sub">Ridgeline Electrical — Prefab</div>
    </div>
  </header>

  <div class="name-bar" id="nameBar">
    <div class="name-bar-label">Your name:</div>
    <div class="name-input-wrap">
      <input type="text" id="foremanNameInput" placeholder="Enter your name…"/>
      <button class="btn-set-name" onclick="setForemanName()">Set</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading shipments…</div>
  </div>
</div>

<script>
const RAW      = 'https://raw.githubusercontent.com/RidgeHub/Prefab/main/prefab-projects.json';
const GH_API   = 'https://api.github.com/repos/RidgeHub/Prefab/contents/prefab-projects.json';
const GH_TOKEN = 'FOREMAN_WEBHOOK_PLACEHOLDER'; // replaced server-side if needed

let projects = [], ghSha = null;
let foremanName = localStorage.getItem('foreman_name') || '';

function setForemanName(){
  const n = document.getElementById('foremanNameInput').value.trim();
  if(!n){ alert('Please enter your name.'); return; }
  foremanName = n;
  localStorage.setItem('foreman_name', n);
  updateNameBar();
}

function updateNameBar(){
  const bar = document.getElementById('nameBar');
  if(foremanName){
    bar.innerHTML = `<div class="name-bar-label">Signed in as:</div><strong style="color:var(--yellow);">${esc(foremanName)}</strong><button onclick="localStorage.removeItem('foreman_name');foremanName='';updateNameBar();" style="background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;margin-left:auto;">Change</button>`;
  } else {
    bar.innerHTML = `<div class="name-bar-label">Your name:</div><div class="name-input-wrap"><input type="text" id="foremanNameInput" placeholder="Enter your name…"/><button class="btn-set-name" onclick="setForemanName()">Set</button></div>`;
  }
}

async function loadProjects(){
  try{
    const res = await fetch(RAW + '?v=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    projects = await res.json();
    // get sha for saves
    const meta = await fetch(GH_API, {headers:{Accept:'application/vnd.github.v3+json'}});
    if(meta.ok){ ghSha = (await meta.json()).sha; }
    renderProjects();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Could not load shipments.<br/>Check your connection.</div>';
  }
}

function renderProjects(){
  const content = document.getElementById('content');
  // Show only shipped or received projects
  const relevant = projects.filter(p => p.status === 'shipped' || p.status === 'received' || p.status === 'ready');
  if(!relevant.length){
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>No shipments to receive yet.<br/>Check back when items are shipped.</div>';
    return;
  }
  content.innerHTML = relevant.map(p => {
    const status = p.status || 'inprogress';
    const pillClass = `pill-${status}`;
    const pillLabel = {inprogress:'In Progress',ready:'Ready for Delivery',shipped:'Shipped',received:'Received'}[status]||status;
    const isShipped = status === 'shipped';
    const isReceived = status === 'received';
    const total = p.assemblies.length;
    const boxes = p.boxCount || '—';
    const onSite = p.onSiteDate ? new Date(p.onSiteDate).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—';

    const actionHTML = isShipped
      ? `<div class="project-action"><button class="btn-received" onclick="markReceived('${p.id}')">✅ Mark as Received</button></div>`
      : isReceived
      ? `<div class="project-action"><div class="received-info">✓ Received by ${esc(p.receivedBy||'—')} on ${esc(p.receivedAt||'—')}</div></div>`
      : `<div class="project-action"><div style="font-size:12px;color:var(--text3);font-family:var(--mono);text-align:center;padding:4px;">Not yet shipped</div></div>`;

    return `<div class="project-card" id="proj-${p.id}">
      <div class="project-card-header">
        <div>
          <div class="project-name">${esc(p.name)}</div>
          <div class="project-meta">${p.num?'#'+esc(p.num)+'&nbsp;·&nbsp;':''} ${total} assemblies</div>
        </div>
        <div class="status-pill ${pillClass}">${pillLabel}</div>
      </div>
      <div class="project-details">
        <div class="detail-item"><div class="detail-label">Boxes</div><div class="detail-value">📦 ${boxes}</div></div>
        <div class="detail-item"><div class="detail-label">Needed on Site</div><div class="detail-value">${onSite}</div></div>
      </div>
      ${actionHTML}
    </div>`;
  }).join('');
}

async function markReceived(projectId){
  if(!foremanName){ alert('Please enter your name first.'); return; }
  if(!confirm('Mark this delivery as received?')) return;
  const project = projects.find(p => p.id === projectId);
  if(!project) return;
  project.status = 'received';
  project.receivedBy = foremanName;
  project.receivedAt = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});

  // Try to save back to GitHub using public token approach
  // Since foreman doesn't have token, we save optimistically and show success
  // Admin save happens next time prefab board is opened
  localStorage.setItem('foreman_pending_received', JSON.stringify({projectId, receivedBy:foremanName, receivedAt:project.receivedAt}));

  // Try save with stored token if available
  const token = localStorage.getItem('prefab_gh_token') || '';
  if(token && ghSha){
    try{
      const body = {message:'Mark received: '+project.name, content:btoa(unescape(encodeURIComponent(JSON.stringify(projects,null,2)))), sha:ghSha};
      const res = await fetch(GH_API,{method:'PUT',headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
      if(res.ok){ ghSha=(await res.json()).content.sha; localStorage.removeItem('foreman_pending_received'); }
    }catch(e){}
  }
  renderProjects();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

updateNameBar();
loadProjects();
</script>
</body>
</html>
