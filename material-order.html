<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ridgeline Electrical — Material Orders</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --accent:#c84b2f;--accent2:#e8813a;
  --text:#e8eaf0;--text2:#8b91a8;--text3:#555b72;
  --green:#2ecc8a;--green-bg:rgba(46,204,138,0.08);
  --yellow:#f0c040;--yellow-bg:rgba(240,192,64,0.08);
  --blue:#5b9cf6;--blue-bg:rgba(91,156,246,0.08);
  --red:#e05555;--red-bg:rgba(224,85,85,0.08);
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --radius:12px;--card-radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}
/* Shared header */
.site-header{padding:.875rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.site-header-left{display:flex;align-items:center;gap:10px}
.site-logo-mark{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;flex-shrink:0;text-decoration:none}
.site-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px}
.site-breadcrumb a{color:var(--text2);text-decoration:none;font-size:13px}
.site-breadcrumb a:hover{color:var(--text)}
.site-breadcrumb-sep{color:var(--text3)}
.site-breadcrumb-current{color:var(--text);font-weight:600}
.site-header-right{display:flex;align-items:center;gap:8px}
/* Buttons */
.btn{background:none;border:1px solid var(--border2);border-radius:6px;padding:7px 13px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--surface2);border-color:rgba(255,255,255,0.2);color:var(--text)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn-primary:hover{background:#b03d24;border-color:#b03d24;color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#000;font-weight:600}
.btn-green:hover{background:#25b879;border-color:#25b879}
.btn-print{background:#1a6fba;border-color:#1a6fba;color:#fff;font-weight:500}
.btn-print:hover{background:#155a99;border-color:#155a99}
/* Content area */
.content{padding:1.25rem;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color 0.2s}
.card:hover{border-color:var(--border2)}
.card-header{padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);font-family:var(--mono)}
/* Form elements */
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text2);font-family:var(--mono)}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=file],select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color 0.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
/* Sync status */
.sync-status{font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.synced{background:var(--green)}.sync-dot.syncing{background:var(--accent2);animation:blink 1s infinite}.sync-dot.error{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
/* Progress */
.progress-bar-outer{flex:1;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:99px;transition:width 0.4s}
/* Badges */
.badge{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:99px}
.badge-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(46,204,138,0.2)}
.badge-miss{background:var(--red-bg);color:var(--red);border:1px solid rgba(224,85,85,0.2)}
/* Empty / loading */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-family:var(--mono);font-size:12px}
.empty-icon{font-size:36px;margin-bottom:10px}
.loading-state{text-align:center;padding:2rem;color:var(--text3);font-family:var(--mono);font-size:12px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--border2);border-bottom:none;width:100%;max-width:540px;padding:1.5rem;max-height:88vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1.25rem}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;justify-content:center;padding:11px;font-size:14px}
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}

.project-selector{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;gap:8px}
.order-header{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem}
.order-title{font-size:18px;font-weight:700;margin-bottom:4px}
.order-meta{font-size:12px;color:var(--text2);font-family:var(--mono)}
.order-print-date{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:4px;display:none}
.category-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.category-header{padding:9px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);font-family:var(--mono)}
.order-item{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);gap:14px}
.order-item:last-child{border-bottom:none}
.order-qty{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);width:48px;flex-shrink:0;text-align:right}
.order-name{flex:1;font-size:13px;line-height:1.4;color:var(--text)}
@media print{
  .site-header,.project-selector,.no-print,body::before{display:none!important}
  body{background:#fff;color:#000}
  .order-print-date{display:block!important}
  .order-title,.order-name{color:#000}
  .category-header{background:#eee;color:#333}
  .order-item{border-bottom:1px solid #ddd}
  .order-qty{color:#c84b2f}
  .content{padding:0;gap:8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="site-header">
    <div class="site-header-left">
      <a href="index.html" class="site-logo-mark">RE</a>
      <div class="site-breadcrumb">
        <a href="index.html">Prefab Hub</a>
        <span class="site-breadcrumb-sep">&#8250;</span>
        <span class="site-breadcrumb-current">Material Orders</span>
      </div>
    </div>
    <div class="site-header-right">
      <button class="btn btn-print no-print" onclick="window.print()">Print</button>
    </div>
  </div>
  <div class="content">
    <div class="project-selector">
      <div class="form-label">Select Project</div>
      <select id="projectSelect" onchange="renderOrder()"><option value="">Loading...</option></select>
    </div>
    <div id="orderContent"><div class="empty-state"><div class="empty-icon">&#128230;</div>Select a project above.</div></div>
  </div>
</div>
<script>
const RAW='https://raw.githubusercontent.com/RidgeHub/Prefab/main/prefab-projects.json';
let projects=[];
const CATS=['Plaster Ring','Device','Wire Connector','Pigtail','Device Cover','Other'];
const CAT_LABELS={'Plaster Ring':'Plaster Rings','Device':'Devices','Wire Connector':'Wire Connectors','Pigtail':'Pigtails','Device Cover':'Device Covers','Other':'Other Items'};
async function loadProjects(){
  try{
    const res=await fetch(RAW+'?v='+Date.now());
    if(!res.ok) throw new Error();
    projects=await res.json();
    const sel=document.getElementById('projectSelect');
    sel.innerHTML='<option value="">- Select a project -</option>'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.num?' (#'+esc(p.num)+')':'')+'</option>').join('');
  }catch(e){document.getElementById('orderContent').innerHTML='<div class="empty-state">Could not load projects.</div>';}
}
function stripQty(s){return s.replace(/\s*\(\d+\)\s*/g,'').trim();}
function getQty(s){const m=s.match(/\((\d+)\)/);return m?parseInt(m[1]):1;}
function stripAdj(s){return s.replace(/[\/,]?\s*Adj(ustable)?/gi,'').replace(/Adj(ustable)?\s*[\/,]?\s*/gi,'').trim();}
function renderOrder(){
  const id=document.getElementById('projectSelect').value;
  const el=document.getElementById('orderContent');
  if(!id){el.innerHTML='<div class="empty-state"><div class="empty-icon">&#128230;</div>Select a project above.</div>';return;}
  const project=projects.find(p=>p.id===id);
  if(!project) return;
  const bom={};
  project.assemblies.forEach(a=>{
    const add=(raw,cat)=>{
      if(!raw) return;
      const items=raw.includes('|')?raw.split('|'):[raw];
      items.forEach(item=>{
        const name=stripAdj(stripQty(item.trim()));
        const qty=getQty(item);
        if(!name) return;
        if(!bom[cat]) bom[cat]={};
        bom[cat][name]=(bom[cat][name]||0)+qty;
      });
    };
    add(a.plaster,'Plaster Ring');add(a.wire,'Wire Connector');add(a.pigtail,'Pigtail');
    (a.devices||[]).forEach(d=>add(d,'Device'));
  });
  const onSite=project.onSiteDate?new Date(project.onSiteDate).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
  let html='<div class="order-header"><div class="order-title">'+esc(project.name)+'</div><div class="order-meta">'+(project.num?'Project #'+esc(project.num)+' &middot; ':'')+project.assemblies.length+' assemblies'+(onSite?' &middot; Needed: '+onSite:'')+'</div><div class="order-print-date">Printed: '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</div></div>';
  const cats=CATS.filter(c=>bom[c]&&Object.keys(bom[c]).length);
  cats.forEach(cat=>{
    const items=Object.entries(bom[cat]).sort((a,b)=>b[1]-a[1]);
    html+='<div class="category-section"><div class="category-header">'+(CAT_LABELS[cat]||cat)+'</div>'+items.map(([name,qty])=>'<div class="order-item"><div class="order-qty">'+qty+'</div><div class="order-name">'+esc(name)+'</div></div>').join('')+'</div>';
  });
  el.innerHTML=html;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadProjects();
</script>
</body>
</html>
